<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #style-selector {
            position: absolute;
            top: 10px;
            right: 50px;
            z-index: 1;
            background: white;
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 14px;
        }
        #style-selector select {
            margin-left: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="style-selector">
        <label>Style
            <select id="theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="white">White</option>
                <option value="grayscale">Grayscale</option>
                <option value="black">Black</option>
                <option value="blueberry" selected>Blueberry</option>
                <option value="blueberry-milk">Blueberry Milk</option>
            </select>
        </label>
        <label style="margin-left: 12px;">
            <input type="checkbox" id="pois"> POIs
        </label>
        <label style="margin-left: 12px;">
            <input type="checkbox" id="buildings3d"> 3D Buildings
        </label>
        <label style="margin-left: 12px;">
            <input type="checkbox" id="shields"> Shields
        </label>
        <label style="margin-left: 12px;">API Key
            <select id="apikey">
                <option value="DEMO-EXAMPLE-001" selected>Demo (valid)</option>
                <option value="CONSUMER-EXAMPLE-001">Consumer (valid)</option>
                <option value="REVOKED-EXAMPLE-001">Revoked (403)</option>
                <option value="WRONG-KEY">Unknown (403)</option>
                <option value="">(no key — 401)</option>
            </select>
        </label>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@protomaps/basemaps@5/dist/basemaps.js"></script>
    <script src="blueberry.js"></script>
    <script>
        const TILES_URL_BASE = window.location.origin + "/tiles/planet/{z}/{x}/{y}.mvt";
        const GLYPHS_DEFAULT = "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf";
        const ATTRIBUTION = '&copy; OpenStreetMap contributors';

        function tilesUrl(apiKey) {
            return apiKey ? TILES_URL_BASE + "?key=" + encodeURIComponent(apiKey) : TILES_URL_BASE;
        }

        function buildStyle(theme, showPois, show3d, showShields, apiKey) {
            var bb = blueberryTheme(theme);
            var flavor = bb ? bb.flavor : basemaps.namedFlavor(theme);
            var layerOpts = bb ? bb.layerOpts({ lang: "en" }) : { lang: "en" };
            var layers = basemaps.layers("protomaps", flavor, layerOpts);
            if (bb) bb.postProcess(layers);
            if (!showPois) {
                layers = layers.filter(function (l) { return l.id !== "pois"; });
            }
            if (!showShields) {
                layers = layers.filter(function (l) { return l.id !== "roads_shields" && l.id !== "shield_text"; });
            }
            if (show3d) {
                var buildingsIdx = layers.findIndex(function (l) { return l.id === "buildings"; });
                if (buildingsIdx !== -1) {
                    var bl = layers[buildingsIdx];
                    layers[buildingsIdx] = {
                        id: bl.id,
                        type: "fill-extrusion",
                        source: bl.source,
                        "source-layer": bl["source-layer"],
                        filter: bl.filter,
                        minzoom: bl.minzoom || 14,
                        paint: {
                            "fill-extrusion-color": bl.paint["fill-color"] || "#1d344b",
                            "fill-extrusion-height": ["get", "height"],
                            "fill-extrusion-base": 0,
                            "fill-extrusion-opacity": 0.8
                        }
                    };
                }
            }
            return {
                version: 8,
                glyphs: bb ? bb.glyphs : GLYPHS_DEFAULT,
                sprite: bb ? bb.sprite : "https://protomaps.github.io/basemaps-assets/sprites/v4/" + theme,
                sources: {
                    protomaps: {
                        type: "vector",
                        tiles: [tilesUrl(apiKey)],
                        maxzoom: 15,
                        attribution: ATTRIBUTION
                    }
                },
                layers: layers
            };
        }

        const map = new maplibregl.Map({
            container: "map",
            style: buildStyle(
                document.getElementById("theme").value,
                false,
                false,
                false,
                document.getElementById("apikey").value
            ),
            center: [0, 20],
            zoom: 2,
            maxPitch: 85,
            attributionControl: false
        });

        map.addControl(new maplibregl.NavigationControl());
        map.addControl(new maplibregl.AttributionControl({ compact: false, customAttribution: ATTRIBUTION }));

        function currentStyle() {
            return buildStyle(
                document.getElementById("theme").value,
                document.getElementById("pois").checked,
                document.getElementById("buildings3d").checked,
                document.getElementById("shields").checked,
                document.getElementById("apikey").value
            );
        }

        document.getElementById("theme").addEventListener("change", function () {
            map.setStyle(currentStyle());
        });

        document.getElementById("pois").addEventListener("change", function () {
            map.setStyle(currentStyle());
        });

        document.getElementById("buildings3d").addEventListener("change", function () {
            map.setStyle(currentStyle());
        });

        document.getElementById("shields").addEventListener("change", function () {
            map.setStyle(currentStyle());
        });

        document.getElementById("apikey").addEventListener("change", function () {
            map.setStyle(currentStyle());
        });
    </script>
</body>
</html>
