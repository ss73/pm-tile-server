<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #style-selector {
            position: absolute;
            top: 10px;
            right: 50px;
            z-index: 1;
            background: white;
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            font-family: sans-serif;
            font-size: 14px;
        }
        #style-selector select {
            margin-left: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="style-selector">
        <label>Style
            <select id="theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="white">White</option>
                <option value="grayscale">Grayscale</option>
                <option value="black">Black</option>
                <option value="blueberry" selected>Blueberry</option>
            </select>
        </label>
        <label style="margin-left: 12px;">
            <input type="checkbox" id="pois"> POIs
        </label>
        <label style="margin-left: 12px;">
            <input type="checkbox" id="buildings3d"> 3D Buildings
        </label>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@protomaps/basemaps@5/dist/basemaps.js"></script>
    <script>
        const blueberryFlavor = {
            background: "#203751",
            earth: "#203751",
            park_a: "#1b3249",
            park_b: "#1b3249",
            hospital: "#1d344b",
            industrial: "#1d344b",
            school: "#1d344b",
            wood_a: "#1a3148",
            wood_b: "#1a3148",
            pedestrian: "#1e354c",
            scrub_a: "#1c3349",
            scrub_b: "#1c3349",
            glacier: "#1c3048",
            sand: "#1e354d",
            beach: "#1e354d",
            aerodrome: "#1d344b",
            runway: "#233c59",
            water: "#011523",
            zoo: "#1b3249",
            military: "#1d344b",
            tunnel_other_casing: "#0a1a2a",
            tunnel_minor_casing: "#0a1a2a",
            tunnel_link_casing: "#0a1a2a",
            tunnel_major_casing: "#0a1a2a",
            tunnel_highway_casing: "#0a1a2a",
            tunnel_other: "#1a3050",
            tunnel_minor: "#1a3050",
            tunnel_link: "#1a3050",
            tunnel_major: "#1a3050",
            tunnel_highway: "#1a3050",
            pier: "#233C59",
            buildings: "#031F30",
            minor_service_casing: "#0a1a2a",
            minor_casing: "#0a1a2a",
            link_casing: "#0a1a2a",
            major_casing_late: "#0a1a2a",
            highway_casing_late: "#0a1a2a",
            other: "#233C59",
            minor_service: "#1a3050",
            minor_a: "#233C59",
            minor_b: "#1a3050",
            link: "#233C59",
            major_casing_early: "#0a1a2a",
            major: "#233C59",
            highway_casing_early: "#0a1a2a",
            highway: "#2d4a6a",
            railway: "#1a3050",
            boundaries: "#42638C",
            bridges_other_casing: "#0a1a2a",
            bridges_minor_casing: "#0a1a2a",
            bridges_link_casing: "#0a1a2a",
            bridges_major_casing: "#0a1a2a",
            bridges_highway_casing: "#0a1a2a",
            bridges_other: "#233C59",
            bridges_minor: "#233C59",
            bridges_link: "#233C59",
            bridges_major: "#233C59",
            bridges_highway: "#2d4a6a",
            roads_label_minor: "#5A7A96",
            roads_label_minor_halo: "#0a1a2a",
            roads_label_major: "#7599BF",
            roads_label_major_halo: "#0a1a2a",
            ocean_label: "#7599BF",
            subplace_label: "#4A6A82",
            subplace_label_halo: "#0a1a2a",
            city_label: "#A0B8D0",
            city_label_halo: "#203751",
            state_label: "#4A6A82",
            state_label_halo: "#0a1a2a",
            country_label: "#F7F7F7",
            address_label: "#5A7A96",
            address_label_halo: "#0a1a2a",
            pois: {
                blue: "#4A6A82",
                green: "#4A6A82",
                lapis: "#4A6A82",
                pink: "#4A6A82",
                red: "#4A6A82",
                slategray: "#4A6A82",
                tangerine: "#4A6A82",
                turquoise: "#4A6A82"
            },
            landcover: {
                grassland: "rgba(28, 50, 74, 1)",
                barren: "rgba(34, 56, 80, 1)",
                urban_area: "rgba(30, 52, 76, 1)",
                farmland: "rgba(28, 50, 74, 1)",
                glacier: "rgba(26, 48, 72, 1)",
                scrub: "rgba(30, 52, 76, 1)",
                forest: "rgba(24, 46, 70, 1)"
            }
        };

        const TILES_URL = window.location.origin + "/tiles/planet/{z}/{x}/{y}.mvt";
        const GLYPHS_DEFAULT = "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf";
        const GLYPHS_LOCAL = window.location.origin + "/fonts/{fontstack}/{range}.pbf";
        const ATTRIBUTION = '&copy; OpenStreetMap contributors';

        function buildStyle(theme, showPois, show3d) {
            const flavor = theme === "blueberry" ? blueberryFlavor : basemaps.namedFlavor(theme);
            var layerOpts = { lang: "en" };
            if (theme === "blueberry") {
                layerOpts.bold = "Inter-Bold";
                layerOpts.regular = "Inter-Regular";
                layerOpts.italic = "Inter-Italic";
            }
            var layers = basemaps.layers("protomaps", flavor, layerOpts);
            if (theme === "blueberry") {
                layers.forEach(function (l) {
                    if (l.layout && l.layout["text-transform"] === "uppercase") {
                        delete l.layout["text-transform"];
                    }
                    // Major cities brighter, minor cities dimmer
                    if (l.id === "places_locality" && l.paint) {
                        l.paint["text-color"] = [
                            "case",
                            ["<=", ["get", "min_zoom"], 5], "#8AABC5",
                            ["<=", ["get", "min_zoom"], 8], "#6A8AA4",
                            "#4A6A82"
                        ];
                    }
                });
            }
            if (!showPois) {
                layers = layers.filter(function (l) { return l.id !== "pois"; });
            }
            if (show3d) {
                var buildingsIdx = layers.findIndex(function (l) { return l.id === "buildings"; });
                if (buildingsIdx !== -1) {
                    var bl = layers[buildingsIdx];
                    layers[buildingsIdx] = {
                        id: bl.id,
                        type: "fill-extrusion",
                        source: bl.source,
                        "source-layer": bl["source-layer"],
                        filter: bl.filter,
                        minzoom: bl.minzoom || 14,
                        paint: {
                            "fill-extrusion-color": bl.paint["fill-color"] || "#1d344b",
                            "fill-extrusion-height": ["get", "height"],
                            "fill-extrusion-base": 0,
                            "fill-extrusion-opacity": 0.8
                        }
                    };
                }
            }
            return {
                version: 8,
                glyphs: theme === "blueberry" ? GLYPHS_LOCAL : GLYPHS_DEFAULT,
                sprite: "https://protomaps.github.io/basemaps-assets/sprites/v4/" + (theme === "blueberry" ? "dark" : theme),
                sources: {
                    protomaps: {
                        type: "vector",
                        tiles: [TILES_URL],
                        maxzoom: 15,
                        attribution: ATTRIBUTION
                    }
                },
                layers: layers
            };
        }

        const map = new maplibregl.Map({
            container: "map",
            style: buildStyle(document.getElementById("theme").value),
            center: [0, 20],
            zoom: 2,
            maxPitch: 85,
            attributionControl: false
        });

        map.addControl(new maplibregl.NavigationControl());
        map.addControl(new maplibregl.AttributionControl({ compact: false, customAttribution: ATTRIBUTION }));

        function currentStyle() {
            return buildStyle(
                document.getElementById("theme").value,
                document.getElementById("pois").checked,
                document.getElementById("buildings3d").checked
            );
        }

        document.getElementById("theme").addEventListener("change", function () {
            map.setStyle(currentStyle());
        });

        document.getElementById("pois").addEventListener("change", function () {
            map.setStyle(currentStyle());
        });

        document.getElementById("buildings3d").addEventListener("change", function () {
            map.setStyle(currentStyle());
        });
    </script>
</body>
</html>
